repos:
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 'v2.4.0'
  hooks:
    - id: mypy
      additional_dependencies: ['pydantic', 'pytest']
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.23
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    - id: ruff-check
    - id: ruff-format
- repo: https://github.com/MarketSquare/robotframework-robocop
  rev: v9.1.0
  hooks:
    - id: robocop-format
      additional_dependencies: ['click']  # https://github.com/MarketSquare/robotframework-robocop/issues/1750
    - id: robocop
      additional_dependencies: ['click']  # https://github.com/MarketSquare/robotframework-robocop/issues/1750
