repos:
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 'v2.1.0'
  hooks:
    - id: mypy
      additional_dependencies: ['pydantic', 'pytest']
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.14
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.13
  hooks:
    - id: ruff-check
    - id: ruff-format
- repo: local
  hooks:
    - id: robocop
      name: robocop
      entry: uv run robocop check
      language: python
      files: \.(robot|resource)$
